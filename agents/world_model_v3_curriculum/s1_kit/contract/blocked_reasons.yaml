# The blocked_reason sentences (S1-coordinate-system.md, "blocked_reason").
#
# Every defer answer carries one sentence from this file. Every other answer
# has "blocked_reason": null. The sentence tells the user what blocks the task.
# The summary, not this sentence, says what input to give.
#
# The code stays in the backend. The row metadata records blocked_reason_code,
# hidden from the model. The validator and the Stage 2 scorer read the code and
# check that the sentence equals one template of that code, filled as below.
#
# Fields of a template:
#   id        a stable name for the template
#   status    the answer status that the template fits. "lookup" means the
#             status of the successful lookup in a partial failure. "planned"
#             means no trace exists yet, so do not generate the template.
#   template  the sentence, with {slot} markers
#   slots     how each slot is filled:
#               value  copy the value at the first path in "from" that exists
#               count  the length of the list at the first path in "from"
#               label  render the key at the first path in "from" as prose,
#                      with the "labels" map below
#             In a path, <side> is the S1.4 side ("first" or "second") whose
#             gene_id is null. metadata.* paths are hidden row metadata.
#   traces    the traces that use the template
#
# Numbers are digits ("2 genes", not "two genes").

schema_version: mentor-rl-s1-blocked-reasons-v1

labels:
  expected:
    human_gene_symbol: human gene symbol
    human_gene_id: human gene ID
    layer_tag: layer tag
  found:
    module_id: module ID
    context_id: context ID
    transcript_id: transcript ID
    protein_id: protein ID
  species:
    mouse: mouse
  kind:
    human_gene_symbol: symbol
    human_gene_id: ID

codes:
  ambiguous_symbol:
    - id: ambiguous_symbol.lookup
      status: ambiguous
      template: "The symbol {symbol} matches {n} genes in Ensembl release 116, and nothing in the task chooses one."
      slots:
        symbol: {kind: value, from: [result.gene_symbol, result.<side>.input]}
        n: {kind: count, from: [result.candidate_gene_ids, result.<side>.candidate_gene_ids]}
      traces: [S0.5, S1.3.1, S1.3.2, S1.3.3, S1.3.4, S1.3.8 earlier turn, S1.3.9 earlier turn, S1.4.6]
    - id: ambiguous_symbol.multiplex
      status: ambiguous
      template: "The symbol {symbol} matches {n} genes, and {k} of them are nodes in {multiplex_id}, so the multiplex does not choose one."
      slots:
        symbol: {kind: value, from: [result.gene_symbol]}
        n: {kind: count, from: [result.candidate_gene_ids]}
        k: {kind: count, from: [result.present_gene_ids]}
        multiplex_id: {kind: value, from: [result.multiplex_id]}
      traces: [S1.3.6]
    - id: ambiguous_symbol.reply
      status: ambiguous
      template: "The reply does not choose one of the {n} candidates for {symbol}."
      slots:
        n: {kind: count, from: [result.candidate_gene_ids]}
        symbol: {kind: value, from: [result.gene_symbol]}
      traces: [S1.3.9]

  not_found:
    - id: not_found.symbol
      status: not_found
      template: "The registry has no gene with the symbol {input} in Ensembl release 116."
      slots:
        input: {kind: value, from: [result.gene_symbol, result.<side>.input]}
      traces: [S0.6, S1.1.3, S1.4.5]
    - id: not_found.gene_id
      status: not_found
      template: "The registry has no gene with the ID {input} in Ensembl release 116."
      slots:
        input: {kind: value, from: [result.gene_id, result.<side>.input]}
      traces: [S0.7, S1.2.5]

  invalid_input:
    - id: invalid_input.malformed
      status: invalid_input
      template: "The input {input} is not a well-formed {expected}."
      slots:
        input: {kind: value, from: [result.input]}
        expected: {kind: label, from: [result.expected]}
      traces: [S1.2.6, S1.6.6]

  wrong_input_type:
    - id: wrong_input_type
      status: invalid_input
      template: "The input {input} is a {found}, not a {expected}."
      slots:
        input: {kind: value, from: [result.input]}
        found: {kind: label, from: [metadata.found_input_type]}
        expected: {kind: label, from: [result.expected]}
      traces: [S1.6.5, S1.7.5]
      # Also the S1.2 ENST and ENSP inputs (no trace yet): "The input
      # ENST00000269305 is a transcript ID, not a human gene ID."

  no_multiplex_supplied:
    - id: no_multiplex_supplied
      status: planned
      template: "The task asks about multiplex membership, but it names no multiplex."
      slots: {}
      traces: []

  no_multiplex_membership:
    - id: no_multiplex_membership.candidates
      status: not_found
      template: "No candidate for {symbol} is a node in {multiplex_id}."
      slots:
        symbol: {kind: value, from: [result.gene_symbol]}
        multiplex_id: {kind: value, from: [result.multiplex_id]}
      traces: [S1.3.7]
    - id: no_multiplex_membership.resolved
      status: planned
      template: "The gene {gene_id} is not a node in {multiplex_id}."
      slots:
        gene_id: {kind: value, from: [result.gene_id]}
        multiplex_id: {kind: value, from: [result.multiplex_id]}
      traces: []
      # For the planned trace "a clean resolution to a gene that is not in the
      # supplied multiplex". Depends on advisor question #11.

  out_of_scope_species:
    - id: out_of_scope_species
      status: invalid_input
      template: "The input {input} is a {species} gene {kind}, and the registry holds human genes only."
      slots:
        input: {kind: value, from: [result.input]}
        species: {kind: label, from: [metadata.input_species]}
        kind: {kind: label, from: [result.expected]}
      traces: [S1.1.7, S1.2.10]

  unrecognized_metric:
    - id: unrecognized_metric.ambiguous
      status: ambiguous
      template: 'The name "{input}" can mean {c1} or {c2}, and the two have opposite directions.'
      slots:
        input: {kind: value, from: [result.input]}
        c1: {kind: value, from: [result.candidate_metrics.0]}
        c2: {kind: value, from: [result.candidate_metrics.1]}
      traces: [S1.8.5]
    - id: unrecognized_metric.unknown
      status: not_found
      template: 'The metric "{input}" is not in the direction conventions.'
      slots:
        input: {kind: value, from: [result.input]}
      traces: [S1.8.6]

  tool_error:
    - id: tool_error.all_failed
      status: error
      template: "The call to {tool} failed with {error_code}, so there is no registry result for {input}."
      slots:
        tool: {kind: value, from: [result.tool]}
        error_code: {kind: value, from: [result.error_code]}
        input: {kind: value, from: [result.gene_symbol, result.gene_id]}
      traces: [S1.1.8, S1.2.11]
    - id: tool_error.partial
      status: lookup
      template: "The lookup found {n} candidates, but the call to {failed_tool} failed with {error_code}, so no candidate is checked in {multiplex_id}."
      slots:
        n: {kind: count, from: [result.candidate_gene_ids]}
        failed_tool: {kind: value, from: [result.failed_tool]}
        error_code: {kind: value, from: [result.error_code]}
        multiplex_id: {kind: value, from: [result.multiplex_id]}
      traces: [S1.3.10]
