# The validator's view of one generated row (S1 spec, "Trace contract" and
# "Row metadata"). A corpus file is JSONL: one row per line. The S0 v7 and S1
# builders write rows in this form, or the validator reads them through an
# adapter that gives this form.
#
# A row:
#   {"row_id": "...",
#    "messages": [...],
#    "tools": [...],          the tool definitions that the prompt lists
#    "metadata": {...}}       hidden from the model
#
# Messages, in order:
#   {"role": "system", "content": "<the one S1 system prompt>"}
#   {"role": "harness", "content": "<one harness context block>"}   zero or more
#   an earlier turn, only in a multi-turn row, rendered as at inference:
#     {"role": "user", "content": "..."}
#     {"role": "assistant", "content": <answer>}                    no thinking
#   the trained turn:
#     {"role": "user", "content": "..."}
#     zero or more steps of
#       {"role": "assistant", "thinking": "...", "tool_call": {"name": ..., "arguments": {...}}}
#       {"role": "tool", "name": ..., "content": <tool result object>}
#     {"role": "assistant", "thinking": "...", "content": <answer>}
#
# The last user message starts the trained turn. An answer is one JSON
# object, or a string that holds one.

row_keys: [row_id, messages, tools, metadata]
roles: [system, harness, user, assistant, tool]

# The fields of the metadata record. The model sees none of them.
hidden_metadata:
  [book_mode, step, question_family, form, source_trace, split_unit,
   blocked_reason_code, found_input_type, input_species, schema_version,
   system_prompt_sha256, tool_contract_version, ensembl_release,
   identifier_registry_id]

# The model must not see these names, or the values of these fields, in the
# system prompt, a harness block, or a user message. A visible name or value
# tells the model the form, the book mode, or the answer.
names_never_visible:
  [book_mode, question_family, blocked_reason_code, source_trace, split_unit,
   found_input_type, input_species]
values_never_visible: [book_mode, step, question_family, source_trace]
