status: [resolved, not_found, ambiguous, invalid_input, error]
continuation_decision: [continue, stop, defer]
loop_control: [continue, revise, stop]

# Backend only. The answer carries a sentence from blocked_reasons.yaml, and
# the row metadata records the code.
blocked_reason_code:
  [ambiguous_symbol, not_found, invalid_input, wrong_input_type,
   no_multiplex_supplied, no_multiplex_membership, out_of_scope_species,
   unrecognized_metric, tool_error]

layer_family: [ppi, coexpression, tf_target, bulk_pen, scpen, other]
layer_claims:
  [context_predictive_expression, physical_interaction_recorded,
   regulatory_link_recorded, regulation_direction, global_coexpression,
   cofunctional_association, holds_in_other_contexts, causal_effect]

# A summary asks the user for input only on a defer answer, and a defer
# summary always asks. These phrases mark a request. Matching is exact and
# case-sensitive, so "gives" in a parse summary is not "Give ".
input_request_phrases: ["to continue", "Give ", "Retry ", "Choose ", "Say which "]

# Summary anchors: <GENE:ENSG…|SYMBOL>, <GENE:ENSG…>, and <LAYER:tag>.
# MULTIPLEX is not an anchor until the advisor confirms it (open question 6).
anchor_type: [GENE, LAYER]

# result.expected on an invalid_input answer.
expected: [human_gene_symbol, human_gene_id, layer_tag]

# error_code on an error tool result and in a failure result. The registry
# tools emit only BACKEND_UNAVAILABLE. Species is an answer-level
# blocked_reason, not an error code.
error_code: [BACKEND_UNAVAILABLE]

# result.first.item and result.second.item in S1.4.
s1_4_item: [typed_seed_list, seed_gene_set, module, abstract, query_mygene]

# result.meaning in S1.8.
meaning: [proximity, similarity, evidence]

# Hidden row metadata that fills the label slots of blocked_reasons.yaml.
found_input_type: [module_id, context_id, transcript_id, protein_id]
input_species: [mouse]
