schema_version: mentor-rl-world-model-contract-v1

runtime:
  row_schema_version: multiplex_sft_v3
  tool_contract_version: mentor-rl-world-model-s0-identifier-tools-v3
  system_prompt: >-
    Use the provided local tools only when the task needs a fact that the
    prompt does not supply. Treat a labeled registry block as authoritative.
    Before each call, explain the applicable rule and next action. After the
    last call, use its result. In the final action, explain the result rule
    and claim limit. Return one JSON object with status, provenance, result,
    continuation_decision, blocked_reason, and summary in that order. Do not
    invent identifiers or graph facts.

