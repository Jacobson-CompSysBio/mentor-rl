answer:
  keys: [status, provenance, result, continuation_decision, blocked_reason, summary]

vocabularies:
  status: [resolved, not_found, ambiguous, invalid_input, error]
  continuation_decision: [continue, stop, defer]
  loop_control: [continue, revise, stop]
  blocked_reason_code:
    [ambiguous_symbol, ambiguous_metric, not_found, invalid_input,
     wrong_input_type, no_multiplex_supplied, no_multiplex_membership,
     unknown_multiplex, out_of_scope_species, unrecognized_metric, tool_error]
  layer_family: [ppi, coexpression, tf_target, bulk_pen, scpen, other]
  layer_claims:
    [context_predictive_expression, physical_interaction_recorded,
     regulatory_link_recorded, regulation_direction, global_coexpression,
     cofunctional_association, holds_in_other_contexts, causal_effect]
  input_request_phrases: ["to continue", "Give ", "Retry ", "Choose ", "Say which "]
  anchor_type: [GENE, LAYER, MULTIPLEX]
  expected: [human_gene_symbol, human_gene_id, layer_tag]
  error_code: [BACKEND_UNAVAILABLE]
  s1_4_item: [typed_seed_list, seed_gene_set, module, abstract, query_mygene]
  meaning: [proximity, similarity, evidence]
  found_input_type: [module_id, context_id, transcript_id, protein_id]
  input_species: [mouse]

rows:
  row_keys: [row_id, messages, tools, metadata]
  roles: [system, harness, user, assistant, tool]
  metadata:
    required:
      [book_mode, step, question_family, form, source_trace, split_unit,
       blocked_reason_code, schema_version, system_prompt_sha256,
       tool_contract_version, ensembl_release, identifier_registry_id]
    optional: [found_input_type, input_species]
  names_never_visible:
    [book_mode, question_family, blocked_reason_code, source_trace, split_unit,
     found_input_type, input_species]
  values_never_visible: [book_mode, step, question_family, source_trace]

provenance:
  key_always_present: true
  channels: [registry, graph]
  registry_block:
    keys: [registry, release, evidence_id]
    registry: ensembl
    release: "116"
    evidence_id_pattern: "^ev_reg_[a-z0-9]{6}$"
  graph_block:
    keys: [multiplex_id, graph_version, layer_scope, evidence_id]
    multiplex_id_pattern: "^[A-Za-z0-9_.-]+$"
    graph_version_pattern: "^[a-f0-9]{64}$"
    layer_scope: all
    evidence_id_pattern: "^ev_mem_[a-z0-9]{6}$"
  producer_channel:
    lookup_human_gene_symbol: registry
    lookup_human_ensembl_gene_id: registry
    check_multiplex_membership: graph
    harness_registry_block: registry
  lookup_tools: [lookup_human_gene_symbol, lookup_human_ensembl_gene_id]
  error_results_are_not_evidence: true
  evidence_id_unique_across_rows: true
  harness_registry_block:
    header: "Registry entries, Ensembl release 116:"
    keys: [provenance, entries]
    resolved_entry: [gene_id, gene_symbol]
    ambiguous_entry: [status, gene_symbol, candidate_gene_ids, candidate_details]

tools:
  callable:
    [lookup_human_gene_symbol, lookup_human_ensembl_gene_id,
     check_multiplex_membership]
  error_result:
    keys: [status, provenance, error_code, message]
    status: error
    provenance: null
  definitions:
    lookup_human_gene_symbol:
      args: {gene_symbol: str}
      normalizes: [trim_spaces, ignore_case]
      returns:
        resolved: [status, provenance, gene_id, gene_symbol]
        ambiguous: [status, provenance, gene_symbol, candidate_gene_ids, candidate_details]
        not_found: [status, provenance, gene_symbol, candidate_gene_ids]
      candidate_details: {chromosome: str, biotype: str}
      provenance_channel: registry
    lookup_human_ensembl_gene_id:
      args: {gene_id: str}
      normalizes: [trim_spaces, ignore_case, strip_numeric_version_suffix]
      canonical_format: "^ENSG[0-9]{11}$"
      returns:
        resolved: [status, provenance, gene_id, gene_symbol]
        not_found: [status, provenance, gene_id, gene_symbol]
        invalid_input: [status, provenance, input, expected]
      provenance_channel: registry
    check_multiplex_membership:
      args: {multiplex_id: str, gene_ids: list}
      returns:
        resolved: [status, provenance, multiplex_id, present_gene_ids, absent_gene_ids]
        not_found: [status, provenance, multiplex_id]
      provenance_channel: graph
    resolve_context_ontology:
      available_from: S1.5
      args: {context_id: str}
      returns: [anatomy, cell_type, developmental_stage, pen_layers, ontology_versions]
    query_mygene:
      harness_only: true
      args: {query: str, fields: list}
      returns: [query, requested_fields, results, result_count]

layer_grammars:
  normalized_keys:
    [layer_id, layer_family, source, network, organ, region_path, cell_type_path]
  sep: ":"
  source: coordinate_system.source_flist_path
  policy: preserve_native_layer_id
  families:
    humannet:
      match_prefix: HumanNetV3
      arity: [2]
      fields: [source, network]
      nulls: [organ, region_path, cell_type_path]
      family_from: network
      network_family: {string_ppi: ppi, biogrid_ppi: ppi, coexpression: coexpression}
      unrecognized_network_family: other
    bulk_pen:
      match_prefix: bulkPEN
      arity: [3, 4]
      fields: [prefix, organ, "region_path..."]
      variadic_field: {name: region_path, start: 2, min_items: 1, max_items: 2}
      nulls: [source, network, cell_type_path]
      family_from: prefix
      family: bulk_pen
    scpen:
      match_prefix: scPEN
      arity: [4, 5]
      fields: [prefix, organ, "region_path[0]", "cell_type_path..."]
      fixed_fields: {organ: 1}
      path_field: {name: region_path, start: 2, items: 1}
      variadic_field: {name: cell_type_path, start: 3, min_items: 1, max_items: 2}
      nulls: [source, network]
      family_from: prefix
      family: scpen
    tf_target:
      match_prefix: TFs
      arity: [2]
      fields: [prefix, organ]
      nulls: [source, network, region_path, cell_type_path]
      family_from: prefix
      family: tf_target
  other_namespaces:
    context_id:
      first_field_in: [brain, global]
      arity: [5, 6]
      found_input_type: context_id
    module_id:
      first_field_in: [rwr_loe, mentor_ev]
      found_input_type: module_id

blocked_reasons:
  labels:
    expected:
      {human_gene_symbol: human gene symbol, human_gene_id: human gene ID,
       layer_tag: layer tag}
    found:
      {module_id: module ID, context_id: context ID, transcript_id: transcript ID,
       protein_id: protein ID}
    species: {mouse: mouse}
    kind: {human_gene_symbol: symbol, human_gene_id: ID}
  codes:
    ambiguous_symbol:
      - id: ambiguous_symbol.lookup
        status: ambiguous
        template: "The symbol {symbol} matches {n} genes in Ensembl release 116, and nothing in the task chooses one."
        slots:
          symbol: {kind: value, from: [result.gene_symbol, result.<side>.input]}
          n: {kind: count, from: [result.candidate_gene_ids, result.<side>.candidate_gene_ids]}
      - id: ambiguous_symbol.multiplex
        status: ambiguous
        template: "The symbol {symbol} matches {n} genes, and {k} of them are nodes in {multiplex_id}, so the multiplex does not choose one."
        slots:
          symbol: {kind: value, from: [result.gene_symbol]}
          n: {kind: count, from: [result.candidate_gene_ids]}
          k: {kind: count, from: [result.present_gene_ids]}
          multiplex_id: {kind: value, from: [result.multiplex_id]}
      - id: ambiguous_symbol.reply
        status: ambiguous
        template: "The reply does not choose one of the {n} candidates for {symbol}."
        slots:
          n: {kind: count, from: [result.candidate_gene_ids]}
          symbol: {kind: value, from: [result.gene_symbol]}
    ambiguous_metric:
      - id: ambiguous_metric.name
        status: ambiguous
        template: 'The name "{input}" can mean {c1} or {c2}, and the two have opposite directions.'
        slots:
          input: {kind: value, from: [result.input]}
          c1: {kind: value, from: [result.candidate_metrics.0]}
          c2: {kind: value, from: [result.candidate_metrics.1]}
    not_found:
      - id: not_found.symbol
        status: not_found
        template: "The registry has no gene with the symbol {input} in Ensembl release 116."
        slots: {input: {kind: value, from: [result.gene_symbol, result.<side>.input]}}
      - id: not_found.gene_id
        status: not_found
        template: "The registry has no gene with the ID {input} in Ensembl release 116."
        slots: {input: {kind: value, from: [result.gene_id, result.<side>.input]}}
    invalid_input:
      - id: invalid_input.malformed
        status: invalid_input
        template: "The input {input} is not a well-formed {expected}."
        slots:
          input: {kind: value, from: [result.input]}
          expected: {kind: label, from: [result.expected]}
    wrong_input_type:
      - id: wrong_input_type
        status: invalid_input
        template: "The input {input} is a {found}, not a {expected}."
        slots:
          input: {kind: value, from: [result.input]}
          found: {kind: label, from: [metadata.found_input_type]}
          expected: {kind: label, from: [result.expected]}
    no_multiplex_supplied:
      - id: no_multiplex_supplied
        status: planned
        template: "The task asks about multiplex membership, but it names no multiplex."
        slots: {}
    no_multiplex_membership:
      - id: no_multiplex_membership.candidates
        status: not_found
        template: "No candidate for {symbol} is a node in {multiplex_id}."
        slots:
          symbol: {kind: value, from: [result.gene_symbol]}
          multiplex_id: {kind: value, from: [result.multiplex_id]}
      - id: no_multiplex_membership.resolved
        status: not_found
        template: "The gene {gene_id} is not a node in {multiplex_id}."
        slots:
          gene_id: {kind: value, from: [result.gene_id]}
          multiplex_id: {kind: value, from: [result.multiplex_id]}
    unknown_multiplex:
      - id: unknown_multiplex
        status: not_found
        template: "The multiplex {multiplex_id} is not registered."
        slots: {multiplex_id: {kind: value, from: [result.multiplex_id]}}
    out_of_scope_species:
      - id: out_of_scope_species
        status: invalid_input
        template: "The input {input} is a {species} gene {kind}, and the registry holds human genes only."
        slots:
          input: {kind: value, from: [result.input]}
          species: {kind: label, from: [metadata.input_species]}
          kind: {kind: label, from: [result.expected]}
    unrecognized_metric:
      - id: unrecognized_metric.unknown
        status: not_found
        template: 'The metric "{input}" is not in the direction conventions.'
        slots: {input: {kind: value, from: [result.input]}}
    tool_error:
      - id: tool_error.all_failed
        status: error
        template: "The call to {failed_tool} failed with {error_code}, so there is no registry result for {input}."
        slots:
          failed_tool: {kind: value, from: [result.failed_tool]}
          error_code: {kind: value, from: [result.error_code]}
          input: {kind: value, from: [result.gene_symbol, result.gene_id]}
      - id: tool_error.partial
        status: lookup
        template: "The lookup found {n} candidates, but the call to {failed_tool} failed with {error_code}, so no candidate is checked in {multiplex_id}."
        slots:
          n: {kind: count, from: [result.candidate_gene_ids]}
          failed_tool: {kind: value, from: [result.failed_tool]}
          error_code: {kind: value, from: [result.error_code]}
          multiplex_id: {kind: value, from: [result.multiplex_id]}

