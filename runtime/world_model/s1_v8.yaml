      step: "The registry maps {symbol} to {count} candidate IDs, and {target_id} is not one of them.\
        \ Every candidate in this nonempty list differs from the comparison target, so the two mentions\
        \ name different genes. The comparison is resolved without selecting a single candidate for the\
