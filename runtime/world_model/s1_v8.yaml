        reason; omit gene_id because order alone cannot resolve ambiguity.'
      4: The lookup returns {count} candidates for {symbol}; unrelated harness entries supply no choice
        or multiplex. Keep only gene_symbol, candidate_gene_ids, and candidate_details in result; preserve
        lookup evidence and return ambiguous/defer with a blocked reason.
