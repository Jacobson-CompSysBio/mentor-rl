  S1.6:
    output_directory: data/world_model_v4/corpora/s1_v8/s1_6
    train_diverse_lists: true
    train_layer_reasoning: true
    train_bulk_pen_reasoning:
      direct: "The supplied tag {layer_id} follows the bulkPEN grammar. The prefix sets layer_family to\
        \ bulk_pen. The next component gives organ {organ}, and the remaining colon-separated components\
        \ give region_path {region_path}. Copy layer_id exactly and preserve each region component\u2019\
