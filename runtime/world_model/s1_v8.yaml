      step: "The supplied tag {layer_id} follows the two-component HumanNet grammar. The prefix sets source\
        \ to HumanNetV3. The second component gives network {network}. The family mapping assigns string_ppi\
        \ and biogrid_ppi to ppi, coexpression to coexpression, and every other network name to other.\
        \ For this network, set layer_family to {layer_family}. The family value other is a valid classification\
        \ for a well-formed HumanNet tag. Copy layer_id and the network spelling exactly, including underscores.\
