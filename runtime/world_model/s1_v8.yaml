    train_membership_reasoning:
      after_lookup: The lookup supplies {gene_id} for {symbol}, and the membership request remains unanswered.
        Check this ID in the requested multiplex.
      direct: The membership result lists {gene_id} as present, so return resolved with present:true and
        both evidence channels. The request is complete, so stop.
      step: The membership result lists {gene_id} as present, so return resolved with present:true and
        both evidence channels. The next workflow step needs this membership result, so continue.
    train_absent_membership_reasoning:
      after_lookup: The lookup supplies {gene_id} for {symbol}, and the membership request remains unanswered.
        Check this ID in the requested multiplex.
      direct: The membership result lists {gene_id} as absent, so return resolved with present:false,
        both evidence channels, and no blocked reason. The request is complete, so stop.
      step: The membership result lists {gene_id} as absent, so return resolved with present:false, both
        evidence channels, and no blocked reason. The next workflow step needs this membership result,
        so continue.
    train_unknown_multiplex_reasoning:
      after_lookup: The lookup supplies {gene_id} for {symbol}, and the membership request remains unanswered.
        Check this ID in the requested multiplex.
      direct: The requested multiplex is unregistered, so the gene's membership is unknown; return not_found
        with present:null. Preserve both evidence channels and defer with a blocked reason until a registered
        multiplex is supplied.
      step: The requested multiplex is unregistered, so the gene's membership is unknown; return not_found
        with present:null. Preserve both evidence channels and defer with a blocked reason until a registered
        multiplex is supplied.
    train_final_reasoning:
      2: The registry resolves {symbol} to {gene_id}, completing the requested lookup. Because the user
        needs this mapping for a later workflow step, return it with registry evidence and continue.
      3: The registry reports not_found for {symbol}; this release provides no mapping. Preserve the queried
