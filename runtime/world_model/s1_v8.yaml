    train_humannet_reasoning:
      direct: The supplied tag {layer_id} follows the two-component HumanNet grammar. The prefix sets
        source to HumanNetV3. The second component gives network {network}. The family mapping assigns
        string_ppi and biogrid_ppi to ppi, coexpression to coexpression, and every other network name
