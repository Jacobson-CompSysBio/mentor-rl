    train_unresolved_symbol_reasoning:
      direct: "The registry returned not_found for {input}, with no candidate IDs. The abstract mention\u2019\
        s identity remains unknown; an empty candidate list does not justify setting same_gene to false.\
        \ I cannot infer a mapping from memory, the module context, or the literal input strings. Build\
