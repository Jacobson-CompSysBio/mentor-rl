      keep_tool_fields: true
      none_present_status: ambiguous
    train_multiplex_reasoning: true
    train_single_membership_reasoning:
      after_lookup: The lookup returns {count} candidates for {symbol}, and the {source} names {multiplex_id}.
        Check all candidate_gene_ids in that multiplex before selecting an ID.
      direct: Only {gene_id} is present in {multiplex_id}, resolving this request; the user requested
        only this result, so stop. Return resolved with gene_id, gene_symbol, candidate_gene_ids, candidate_details,
        multiplex_id, present_gene_ids, absent_gene_ids, both evidence channels, and no blocked reason.
      step: Only {gene_id} is present in {multiplex_id}, resolving this request; the user needs this result
        for a later workflow step, so continue. Return resolved with gene_id, gene_symbol, candidate_gene_ids,
        candidate_details, multiplex_id, present_gene_ids, absent_gene_ids, both evidence channels, and
        no blocked reason.
    train_multiple_membership_reasoning:
      after_lookup: The lookup returns {count} candidates for {symbol}, and the {source} names {multiplex_id}.
        Check all candidate_gene_ids in that multiplex before selecting an ID.
      final: The membership check leaves {present_count} of {count} candidates for {symbol} in {multiplex_id},
        so it does not identify one gene. Return ambiguous/defer with a blocked reason asking the user
        to choose one of the present IDs. Keep gene_symbol, candidate_gene_ids, candidate_details, multiplex_id,
        present_gene_ids, and absent_gene_ids exactly as returned, retaining absent_gene_ids even when
        empty and preserving both registry and graph evidence. Omit a singular gene_id, and wait for that
        choice even when a later workflow step needs the result.
    train_no_membership_reasoning:
      after_lookup: The lookup returns {count} candidates for {symbol}, and the {source} names {multiplex_id}.
        Check all candidate_gene_ids in that multiplex before selecting an ID.
      final: The membership check finds no present candidates for {symbol} in {multiplex_id}; all {count}
        registry candidates are absent from this multiplex. The lookup remains ambiguous, and choosing
        one of these IDs cannot supply a usable node for the requested multiplex. Return ambiguous/defer
        with a blocked reason explaining that another gene or multiplex is needed. Keep exactly gene_symbol,
        candidate_gene_ids, candidate_details, multiplex_id, present_gene_ids, and absent_gene_ids, including
        the empty present_gene_ids list and every returned absent ID. Preserve both registry and graph
        evidence and omit a singular gene_id. Both direct and workflow requests remain blocked, so defer
        until the request changes.
    train_user_choice_reasoning:
      direct: 'The reply selects {gene_id}, which appears in the earlier candidate_gene_ids list for {symbol},
        so the user has resolved the choice. Build the result with exactly three fields: gene_id for the
        selected ID, gene_symbol for the earlier canonical symbol, and candidate_gene_ids for the entire
        earlier list in its original order. Keep the full list after selection; candidate_details and
        other fields do not belong in this resolved result. Preserve the earlier registry evidence and
        null graph provenance, and return resolved with no blocked reason. No new lookup or membership
        check is needed. This completes the user''s standalone gene-ID request, so stop.'
      step: 'The reply selects {gene_id}, which appears in the earlier candidate_gene_ids list for {symbol},
        so the user has resolved the choice. Build the result with exactly three fields: gene_id for the
        selected ID, gene_symbol for the earlier canonical symbol, and candidate_gene_ids for the entire
